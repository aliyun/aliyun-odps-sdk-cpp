# ============================================================================
# MaxStorage Benchmark Configuration Template
#
# Usage:
#   ./tool MaxStorageBenchmarkTool --config benchmark_config.ini
#   ./tool MaxStorageBenchmarkTool --config benchmark_config.ini --suite-name=write_1t,read_1t
#
# Structure:
#   [global]       - Connection info shared by all suites
#   [suite:NAME]   - A complete test suite; suite params override global params
#
# Notes:
#   - Lines starting with # or ; are comments
#   - Suite params override global params with the same key
#   - If --suite-name is not specified, all suites will run
#   - Reports are saved to: reports/<YYYYMMDD>/<suite-name>/
# ============================================================================

[global]
# ---- Connection (required) ----
odps-endpoint   = http://service.cn-hangzhou.maxcompute.aliyun.com/api
tunnel-endpoint =
access-key      = <your-access-key-id>
access-secret   = <your-access-key-secret>
project         = <your-project-name>

# ---- Data Management ----
# Truncate table before write tests to prevent data accumulation
# Recommended: true for daily benchmark runs
truncate-before-write = false

# ============================================================================
# Suite: Single-thread write test
# ============================================================================
[suite:write_1t]
table     = perf_test_table
schema    = default
partition =
mode      = write
thread    = 1
rows      = 1000
duration  = 30

# ============================================================================
# Suite: Multi-thread write test
# ============================================================================
[suite:write_4t]
table     = perf_test_table
schema    = default
mode      = write
thread    = 4
rows      = 1000
duration  = 60

# ============================================================================
# Suite: Single-thread read test
# ============================================================================
[suite:read_1t]
table     = perf_test_table
schema    = default
mode      = read
thread    = 1
rows      = 1000
duration  = 30

# ============================================================================
# Suite: Multi-thread read test
# ============================================================================
[suite:read_4t]
table     = perf_test_table
schema    = default
mode      = read
thread    = 4
rows      = 1000
duration  = 60

# ============================================================================
# Suite: Write with warmup and rate limiting
# ============================================================================
;[suite:write_ratelimit]
;table            = perf_test_table
;mode             = write
;thread           = 2
;rows             = 1000
;duration         = 60
;warmup-seconds   = 10
;rate-limit       = 5.0
;monitor-interval = 5
;verbose          = false

# ============================================================================
# Suite: Linear scaling test (auto-increment threads)
# ============================================================================
;[suite:scaling_write]
;table               = perf_test_table
;mode                = write
;rows                = 1000
;duration            = 30
;linear-scaling-test = true
;min-threads         = 1
;max-threads         = 8
;thread-step         = 1

# ============================================================================
# Parameter Reference
# ============================================================================
#
# ---- Connection (typically in [global]) ----
# odps-endpoint        ODPS service endpoint (required)
# tunnel-endpoint      Tunnel endpoint (optional, auto-detected if empty)
# access-key           Access Key ID (required)
# access-secret        Access Key Secret (required)
# project              Project name (required)
#
# ---- Test Target (typically in [suite:*]) ----
# table                Target table name (required)
# schema               Schema name (default: "default")
# partition            Partition spec, e.g. p1=aaa/p2=bbb (default: empty)
# mode                 Benchmark mode: "write" or "read" (default: "write")
#
# ---- Concurrency & Workload ----
# thread               Number of concurrent threads (default: 1)
# rows                 Rows per operation (default: 1000)
# duration             Test duration in seconds (default: 30)
# max-runs             Max operations, 0 = unlimited time-based (default: 0)
#
# ---- Data Generation ----
# random-string-length Length of random strings for string columns (default: 10)
# use-fixed-string     Use fixed string instead of random (default: false)
# fixed-string         The fixed string value (default: "not_set_yet")
#
# ---- Data Management ----
# truncate-before-write Truncate table before write tests (default: false)
#                       Set to true for daily runs to prevent data accumulation
# max-retries          Max retries for transient read errors (default: 3)
#
# ---- Performance Tuning ----
# warmup-seconds       Warmup duration before actual test (default: 0)
# rate-limit           Max ops/sec per thread, 0 = unlimited (default: 0)
# monitor-interval     Realtime monitor interval in seconds, 0 = off (default: 5)
# verbose              Per-operation logging (default: false)
#
# ---- Linear Scaling Test ----
# linear-scaling-test  Enable linear scaling mode (default: false)
# min-threads          Starting thread count (default: 1)
# max-threads          Ending thread count (default: 10)
# thread-step          Thread increment step (default: 1)
